<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brothers Systems - Ranking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="css/imagens/2.ico">
    <link rel="stylesheet" href="css/estilo_ranking.css">
</head>
<body>

<div class="container">

    <!-- Cliente + Agendamentos + Pontuação -->
    <div class="topo-grid">
        <div class="card cliente">
            <img src="css/imagens/barbeiro.png" alt="Cliente" class="cliente-foto">
            <div class="cliente-info">
                <div class="cliente-titulo">Cliente</div>
                <div class="cliente-nome" id="cliente-nome">Carregando...</div>
            </div>
        </div>

        <div class="stat-card agendamentos">
            <img src="css/imagens/calendario.png" alt="agendamentos" class="stat-icone">
            <div>
                <div class="stat-label">Meus agendamentos</div>
                <div class="stat-value" id="stat-agendamentos">0</div>
            </div>
        </div>

        <div class="stat-card pontuacao">
            <img src="css/imagens/pontuacao-maxima.png" alt="pontuação" class="stat-icone">
            <div>
                <div class="stat-label">Pontuação Mensal</div>
                <div class="stat-value" id="stat-pontuacao">0</div>
            </div>
        </div>
    </div>

    <!-- Voltar para o menu -->
    <div class="btn btn-voltar" onclick="window.location.href='menu_cliente.html'">
        🔙 Retornar ao menu principal
    </div>

    <!-- Grupo vermelho -->
    <div class="grupo-vermelho">
        <div class="btn" id="btn-selecionar-mes">📅 Selecionar mês</div>
        <div class="btn" id="btn-mensal" data-periodo="mensal">📆 Mensal</div>
        <div class="btn" onclick="window.location.href='regras_da_casa.html'">📜 Regras da Casa</div>
        <div class="btn" id="btn-anual" data-periodo="anual">📆 Anual</div>
    </div>

    <input type="month" id="input-mes" class="input-mes escondido" aria-label="Selecionar mês">

    <!-- Ranking -->
    <div class="ranking-titulo">
        <img src="css/imagens/ranking.png" alt="Ranking" class="ranking-icone">
        <div class="ranking-texto">
            <span>Ranking</span>
            <span class="ranking-sub">Tabela de pontuação</span>
        </div>
    </div>

    <div class="lista-ranking">
        <p class="ranking-carregando">Carregando ranking...</p>
    </div>

    <footer>
        <img src="css/imagens/logo.png" alt="Brothers Systems" class="logo-footer">
    </footer>

</div>

    <script type="module" src="js/raking.js"></script>
    <script type="module" src="js/modo_escuro.js"></script>
</body>
</html>

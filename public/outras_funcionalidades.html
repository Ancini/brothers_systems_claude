<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brothers Systems - Outras Funcionalidades</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="css/imagens/bs_push.png">
    <link rel="stylesheet" href="css/estilo_barbeiro.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004aad">
    <link rel="apple-touch-icon" href="css/imagens/bs_push.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brothers Systems">
</head>
<body>
    <div class="pagina-barbeiro">
        <div class="borda_principal">
            <div class="card barbeiro">
                <img src="css/imagens/funcionalidades.png" alt="Outras Funcionalidades" class="icone">
                <div class="texto-barbeiro">
                    <span class="titulo1">Outras</span>
                    <span class="titulo2">Funcionalidades</span>
                </div>
            </div>

            <div class="card promocao" onclick="window.location.href='cadastrar_promocao.html'">
                <img src="css/imagens/raio-trovao.png" alt="Promoção" class="icone">
                <div class="texto-promocao">
                    <span class="titulo1"> Cadastrar </span>
                    <span class="titulo2"> Promoção </span>
                </div>
            </div>

            <div class="card fechar-agenda" onclick="window.location.href='fechar_agenda.html'">
                <img src="css/imagens/fechar.png" alt="Fechar Agenda" class="icone">
                <div class="texto-fechar-agenda">
                    <span class="titulo1"> Fechar </span>
                    <span class="titulo2"> Agenda </span>
                </div>
            </div>

            <div class="card painel-administrativo" id="cardPainelAdministrativo">
                <img src="css/imagens/administrador.png" alt="Painel Administrativo" class="icone">
                <div class="texto-admin">
                    <span class="titulo1">Painel</span>
                    <span class="titulo2">Administrativo</span>
                </div>
            </div>

            <div class="card relatorios" onclick="window.location.href='relatorio_barbeiro.html'">
                <img src="css/imagens/relatorio.png" alt="Relatório" class="icone">
                <div class="texto-relatorio">
                    <span class="titulo1"> Relatórios </span>
                </div>
            </div>

            <div class="card relatorio-funcionarios" id="cardRelatorioFuncionarios">
                <img src="css/imagens/relatorio.png" alt="Relatório por funcionário" class="icone">
                <div class="texto-relatorio-funcionarios">
                    <span class="titulo1">Relatório por</span>
                    <span class="titulo2">funcionário</span>
                </div>
            </div>

            <div class="card porcentagem-barbeiro" onclick="window.location.href='cadastrar_porcentagem_barbeiro.html'">
                <img src="css/imagens/servico.png" alt="Cadastrar porcentagem para barbeiro" class="icone">
                <div class="texto-porcentagem">
                    <span class="titulo1">Cadastrar porcentagem</span>
                    <span class="titulo2">para barbeiro</span>
                </div>
            </div>

            <div class="card btn-voltar-funcionalidades" onclick="window.location.href='menu_inicial_barbeiro.html'">
                <span class="titulo2">Voltar</span>
                <img src="css/imagens/voltar.png" alt="" class="icone-voltar">
            </div>
        </div>

        <footer>
            <div class="brand-footer">
                <span class="brand-footer-nome">&lt;Brothers Systems&gt;</span>
                <span class="brand-footer-sub">BARBER SHOP</span>
            </div>
        </footer>
    </div>

    <script type="module" src="js/outras_funcionalidades.js"></script>
    <script type="module" src="js/modo_escuro.js"></script>
</body>
</html>

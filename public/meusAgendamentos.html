<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Agendamentos - Brothers Systems</title>
    <link rel="stylesheet" href="css/meusAgendamentos.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004aad">
    <link rel="apple-touch-icon" href="css/imagens/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brothers Systems">
</head>
<body>
    <div class="container">
        <!-- Header com Cliente e Pontuação -->
        <div class="header-cards">
            <div class="cliente-card">
                <div class="cliente-avatar">
                    <img src="css/imagens/barbeiro.png" alt="Cliente">
                </div>
                <div class="cliente-info">
                    <span class="label">Cliente</span>
                    <span class="nome">Carregando...</span>
                </div>
            </div>

            <div class="ranking-section" onclick="window.location.href='raking.html'">
                <img src="css/imagens/ranking.png" alt="Ranking" class="ranking-icon">
                <div class="ranking-info">
                    <span class="ranking-label">Ranking</span>
                    <span class="ranking-link">Tabela de pontuação</span>
                </div>
            </div>

            <div class="pontuacao-section">
                <img src="css/imagens/pontuacao-maxima.png" alt="Pontuação" class="pontuacao-icon">
                <span class="pontuacao-label">Pontuação Mensal</span>
                <span class="pontuacao-valor" id="pontuacao-usuario">-</span>
            </div>
        </div>

        <!-- Botão Retornar ao Menu -->
        <button class="btn-retornar">
            <img src="css/imagens/voltar.png" alt="" class="icone-voltar">
            Retornar ao menu principal
            <img src="css/imagens/voltar.png" alt="" class="icone-voltar">
        </button>

        <!-- Card Meus Agendamentos -->
        <div class="card-agendamentos-header">
            <img src="css/imagens/calendario.png" alt="Calendário" class="calendario-icon">
            <div class="agendamentos-info">
                <span class="agendamentos-label">Meus Agendamentos</span>
                <span class="agendamentos-total">0</span>
            </div>
        </div>

        <!-- Lista de Agendamentos: renderizada dinamicamente via JS, empilhados
             (layout normal). Mostra os 5 mais recentes por padrão; "‹ anterior"
             busca e mostra os 5 mais antigos seguintes, "› próximo" volta. -->
        <div class="agendamentos-nav">
            <div class="agendamentos-lista"></div>
            <div class="agendamentos-setas">
                <button type="button" class="agendamentos-seta" id="btn-agendamentos-anterior" aria-label="Agendamentos mais antigos">‹</button>
                <span class="agendamentos-pagina-info" id="agendamentos-pagina-info"></span>
                <button type="button" class="agendamentos-seta" id="btn-agendamentos-proximo" aria-label="Agendamentos mais recentes">›</button>
            </div>
        </div>

        <div class="brand-footer">
            <span class="brand-footer-nome">&lt;Brothers Systems&gt;</span>
            <span class="brand-footer-sub">BARBER SHOP</span>
        </div>
    </div>

    <script type="module" src="js/meusAgendamentos.js"></script>
    <script type="module" src="js/modo_escuro.js"></script>
</body>
</html>

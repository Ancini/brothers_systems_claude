<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brothers Systems - Cadastrar Promoção</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="css/imagens/2.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/estilo_cadastrar_promocao.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004aad">
    <link rel="apple-touch-icon" href="css/imagens/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brothers Systems">
</head>
<body>

<div class="container">

    <div class="card barbeiro">
        <img src="css/imagens/barbeiro.png" alt="barbeiro" class="icone">
        <div class="texto-barbeiro">
            <span class="titulo1">Barbeiro</span>
            <span class="titulo2" id="barbeiro-nome">Gabriel E. Ancini</span>
        </div>
    </div>

    <div class="secao-titulo secao-laranja">
        <i class="fa-solid fa-bolt"></i> Cadastrar promoção
    </div>

    <div class="promocao-grid">
        <div class="promocao-coluna promocao-dias">
            <label class="opcao-item">
                <span>Segunda-feira</span>
                <input type="checkbox">
            </label>
            <label class="opcao-item">
                <span>Terça-feira</span>
                <input type="checkbox">
            </label>
            <label class="opcao-item">
                <span>Quarta-feira</span>
                <input type="checkbox">
            </label>
            <label class="opcao-item">
                <span>Quinta-feira</span>
                <input type="checkbox">
            </label>
            <label class="opcao-item">
                <span>Sexta-feira</span>
                <input type="checkbox">
            </label>
            <label class="opcao-item">
                <span>Sábado</span>
                <input type="checkbox">
            </label>
            <label class="opcao-item">
                <span>Domingo</span>
                <input type="checkbox">
            </label>
        </div>

        <div class="promocao-divisor"></div>

        <div class="promocao-coluna promocao-descontos">
            <label class="opcao-item">
                <span>5% OFF</span>
                <input type="checkbox" name="desconto">
            </label>
            <label class="opcao-item">
                <span>10% OFF</span>
                <input type="checkbox" name="desconto">
            </label>
            <label class="opcao-item">
                <span>15% OFF</span>
                <input type="checkbox" name="desconto">
            </label>
            <label class="opcao-item">
                <span>20% OFF</span>
                <input type="checkbox" name="desconto">
            </label>
            <label class="opcao-item">
                <span>25% OFF</span>
                <input type="checkbox" name="desconto">
            </label>
            <label class="opcao-item">
                <span>30% OFF</span>
                <input type="checkbox" name="desconto">
            </label>
            <label class="opcao-item">
                <span>35% OFF</span>
                <input type="checkbox" name="desconto">
            </label>
            <label class="opcao-item">
                <span>40% OFF</span>
                <input type="checkbox" name="desconto">
            </label>
        </div>
    </div>

    <button type="button" class="btn btn-confirmar">
        Confirmar <i class="fa-solid fa-check"></i>
    </button>

    <button type="button" class="btn btn-cancelar">
        Cancelar <i class="fa-solid fa-ban"></i>
    </button>

    <a href="menu_inicial_barbeiro.html" class="btn-retornar">
        <span class="icone-voltar">↩</span>
        Voltar
        <span class="icone-voltar">↩</span>
    </a>

    <footer>
        <div class="brand-footer">
            <span class="brand-footer-nome">&lt;Brothers Systems&gt;</span>
            <span class="brand-footer-sub">BARBER SHOP</span>
        </div>
    </footer>

</div>

    <script type="module" src="js/modo_escuro.js"></script>
</body>
</html>

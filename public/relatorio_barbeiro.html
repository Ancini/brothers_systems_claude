<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brothers Systems - Relatório Barbeiro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="css/imagens/2.ico">
    <link rel="stylesheet" href="css/estilo_relatorio.css">
</head>
<body>

<div class="container">

    <div class="topo-grid">
        <div class="card barbeiro-header">
            <img src="css/imagens/barbeiro.png" alt="Barbeiro" class="barbeiro-foto">
            <div class="barbeiro-info">
                <div class="barbeiro-titulo">Barbeiro</div>
                <div class="barbeiro-nome" id="barbeiro-nome">Carregando...</div>
            </div>
        </div>

        <div class="stat-card vendas">
            <img src="css/imagens/dinheiro.png" alt="vendas" class="stat-icone">
            <div>
                <div class="stat-label">Total de vendas</div>
                <div class="stat-value" id="stat-vendas-hoje">R$0,00 Reais</div>
            </div>
        </div>

        <div class="stat-card agendamentos">
            <img src="css/imagens/calendario.png" alt="agendamentos" class="stat-icone">
            <div>
                <div class="stat-label">Agendamentos</div>
                <div class="stat-value" id="stat-agendamentos-hoje">0</div>
            </div>
        </div>
    </div>

    <div class="btn-ranking" onclick="window.location.href='raking.html'">
        <img src="css/imagens/ranking.png" alt="Ranking" class="ranking-icone">
        <div class="ranking-texto">
            <span>Ranking</span>
            <span class="ranking-sub">Tabela de pontuação</span>
        </div>
    </div>

    <div class="secao-relatorios">Relatórios</div>

    <div class="filtros-botoes">
        <div class="filtro-btn" data-periodo="dia">
            Dia
        </div>
        <div class="filtro-btn ativo" data-periodo="mes">
            Mês
        </div>
        <div class="filtro-btn" data-periodo="ano">
            Ano
        </div>
    </div>

    <div class="periodo-info" id="periodo-info">
        Carregando...
    </div>

    <div class="estatisticas-mensais">
        <div class="estatistica-card conseguiu">
            <img src="css/imagens/dinheiro.png" alt="valor" class="estatistica-icone">
            <div>
                <div class="estatistica-label">Você conseguiu</div>
                <div class="estatistica-valor" id="valor-periodo">R$0,00 Reais</div>
            </div>
        </div>

        <div class="estatistica-card cortou">
            <img src="css/imagens/desenho_barbeiro.png" alt="cortes" class="estatistica-icone">
            <div>
                <div class="estatistica-label">Você cortou</div>
                <div class="estatistica-valor" id="cortes-periodo">0 cabelos</div>
            </div>
        </div>
    </div>

    <div class="btn-voltar" id="btn-voltar">
        <span>Voltar</span>
        <span class="voltar-icone">↩</span>
    </div>

    <footer>
        <div class="brand-footer">
            <span class="brand-footer-nome">&lt;Brothers Systems&gt;</span>
            <span class="brand-footer-sub">BARBER SHOP</span>
        </div>
    </footer>

</div>

    <script type="module" src="js/relatorio_barbeiro.js"></script>
    <script type="module" src="js/modo_escuro.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brothers Systems</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo_barbeiro.css">
    <link rel="icon" type="image/x-icon" href="css/imagens/2.ico"> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004aad">
    <link rel="apple-touch-icon" href="css/imagens/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brothers Systems">
</head>
<body>
    <div class="pagina-barbeiro">
        <div class="borda_principal">
            <div class="card barbeiro">
                <img src="css/imagens/barbeiro.png" alt="barbeiro" class="icone">
                <div class="texto-barbeiro">
                    <span class="titulo1">Barbeiro</span>
                    <span class="titulo2"></span>
                </div>
            </div>
            <div class="card vendas">
                <img src="css/imagens/dinheiro.png" alt="dinheiro" class="icone">
                <div class="texto-vendas">
                    <span class="titulo1">Total de vendas</span>
                    <span class="titulo2">R$ 0,00</span>
                </div>
            </div>
            <div class="card total_agendamentos">
                <img src="css/imagens/calendario.png" alt="calendario" class="icone">
                <div class="texto-agendamentos">
                    <span class="titulo1"> Agendamentos </span>
                    <span class="titulo2"> 0 </span> <!-- O JS atualizará esse número dinamicamente -->
                </div>
            </div>
            <div class="card ranking" onclick="window.location.href='raking.html'">
                <img src="css/imagens/ranking.png" alt="Ranking" class="icone">
                <div class="texto-ranking">
                    <a href="raking.html"> Ranking </a>
                </div>
            </div>
            <div class="card outras-funcionalidades" onclick="window.location.href='outras_funcionalidades.html'">
                <img src="css/imagens/funcionalidades.png" alt="Outras Funcionalidades" class="icone">
                <div class="texto-outras-funcionalidades">
                    <span class="titulo1"> Outras </span>
                    <span class="titulo2"> Funcionalidades </span>
                </div>
            </div>
        </div>

        <!-- LINHA DO TEMPO (DIAS): O JavaScript gerará os 4 botões de dias aqui dentro -->
        <div class="borda-segundaria linha-tempo-dias">
            <!-- Gerado dinamicamente via JS -->
        </div>

        <!-- ÁREA DOS AGENDAMENTOS: o JavaScript renderiza 5 por vez (empilhados,
             layout normal), começando a partir do horário atual; as setas trocam
             de página pra ver os de antes/depois -->
        <div class="agendamentos-nav">
            <div id="container-lista-agendamentos">
                <!-- Gerado dinamicamente via JS -->
            </div>
            <div class="agendamentos-setas">
                <button type="button" class="agendamentos-seta" id="btn-agendamentos-anterior" aria-label="Agendamentos anteriores">‹</button>
                <span class="agendamentos-pagina-info" id="agendamentos-pagina-info"></span>
                <button type="button" class="agendamentos-seta" id="btn-agendamentos-proximo" aria-label="Próximos agendamentos">›</button>
            </div>
        </div>

        <div class="card btn-voltar-menu" onclick="window.location.href='menu_cliente.html'">
            <img src="css/imagens/voltar.png" alt="" class="icone-voltar">
            <span>Voltar</span>
        </div>

        <footer>
            <div class="brand-footer">
                <span class="brand-footer-nome">&lt;Brothers Systems&gt;</span>
                <span class="brand-footer-sub">BARBER SHOP</span>
            </div>
        </footer>
    </div>

    <!-- Arquivo de script responsável pela lógica e atualização dinâmica dos dados -->
    <script src="js/controle_barbeiro.js"></script>
    <script type="module" src="js/modo_escuro.js"></script>
</body>
</html>

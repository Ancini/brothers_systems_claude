<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Brothers Systems - Dias de Funcionamento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="css/imagens/2.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/estilo_cadastrar_dias_funcionamento.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004aad">
    <link rel="apple-touch-icon" href="css/imagens/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brothers Systems">
</head>
<body>

<div class="container">

    <div class="card admin-header">
        <img src="css/imagens/administrador.png" alt="Administrador" class="admin-foto">
        <div class="admin-info">
            <div class="admin-titulo">Administrador</div>
            <div class="admin-nome" id="admin-nome">Carregando...</div>
        </div>
    </div>

    <div class="secao-titulo secao-azul">
        <i class="fa-solid fa-calendar-days"></i> Cadastrar Dias de Abertura p/ estabelecimento
    </div>

    <div class="input-container">
        <select id="estabelecimento-select">
            <option value="" disabled selected>Selecione o Estabelecimento</option>
        </select>
        <i class="fa-solid fa-shop"></i>
    </div>

    <div class="legenda-linha">
        <span class="legenda-pill legenda-azul">Marque os dias da semana</span>
        <span class="legenda-pill legenda-vermelha">Insira o horário de abertura e fechamento</span>
    </div>

    <div class="dias-lista" id="dias-lista">
        <!-- Gerado dinamicamente via JS (cadastrar_dias_funcionamento.js) -->
    </div>

    <button type="button" class="btn btn-salvar" id="btn-salvar">
        <i class="fa-solid fa-floppy-disk"></i> Salvar dias de abertura
    </button>

    <div class="btn btn-cliente" onclick="window.location.href='menu_cliente.html'">
        <i class="fa-solid fa-arrow-right"></i> Ir ao menu Cliente
    </div>

    <footer>
        <div class="brand-footer">
            <span class="brand-footer-nome">&lt;Brothers Systems&gt;</span>
            <span class="brand-footer-sub">BARBER SHOP</span>
        </div>
    </footer>

</div>

    <script type="module" src="js/cadastrar_dias_funcionamento.js"></script>
    <script type="module" src="js/modo_escuro.js"></script>
</body>
</html>
